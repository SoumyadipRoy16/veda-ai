version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: veda-ai-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: veda-ai
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veda-ai-network

  # Redis
  redis:
    image: redis:7.0-alpine
    container_name: veda-ai-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis-password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veda-ai-network

  # Express API + WebSocket Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: veda-ai-api
    environment:
      NODE_ENV: development
      API_PORT: 4001
      MONGODB_URI: mongodb://root:example@mongodb:27017/veda-ai?authSource=admin
      REDIS_URL: redis://:redis-password@redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3.5-flash
      CORS_ORIGIN: http://localhost:3000
      ASSIGNMENT_STORAGE: database
      UPLOAD_MAX_MB: 10
    ports:
      - "4001:4001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    command: npm run dev --workspace @veda-ai/api
    networks:
      - veda-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: veda-ai-worker
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:example@mongodb:27017/veda-ai?authSource=admin
      REDIS_URL: redis://:redis-password@redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3.5-flash
      ASSIGNMENT_STORAGE: database
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - ./packages/shared/src:/app/packages/shared/src
    command: npm run dev --workspace @veda-ai/worker
    networks:
      - veda-ai-network
    restart: unless-stopped

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: veda-ai-web
    environment:
      NODE_ENV: development
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4001/api
      NEXT_PUBLIC_WS_URL: ws://localhost:4001/ws
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
    command: npm run dev --workspace @veda-ai/web
    networks:
      - veda-ai-network

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  veda-ai-network:
    driver: bridge
